name: sih_voice_bridge
description: Offline speech-to-speech emergency communication bridge.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter

  google_fonts: any
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/stt/model_manifest.json
    - assets/models/tts/model_manifest.json
